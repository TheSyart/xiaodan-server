name: ServerOps image
run-name: ServerOps image ${{ inputs.commit || github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact lowercase 40-character commit SHA (empty uses event SHA)
        required: false
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: serverops-image-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate requested commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Record checked-out source
        id: source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$REQUESTED_COMMIT"
          source_url="$(git remote get-url origin)"
          source_url="${source_url%.git}"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "url=$source_url" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - name: Install and check
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          python3 -m unittest discover -s server/tests -v

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish console image
        id: image_console
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: console
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thesyart/xiaodan-server-console:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ steps.source.outputs.url }}
          build-args: |
            SERVEROPS_UID=${{ vars.SERVEROPS_UID || '1000' }}
            SERVEROPS_GID=${{ vars.SERVEROPS_GID || '1000' }}

      # 引擎的构建阶段要拉 10.5G 的上游镜像,而标准 runner 只有约 14G 可用磁盘,
      # 装机预置的那几套工具链又占掉一大半。先腾地方,否则构建会在拉取途中因
      # "no space left on device" 失败 —— 那种报错看起来像网络问题,很误导人。
      - name: Free runner disk before the large upstream pull
        run: |
          echo "清理前:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "清理后:"; df -h / | tail -1

      - name: Build and publish engine image
        id: image_engine
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: engine
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thesyart/xiaodan-server-engine:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ steps.source.outputs.url }}
          build-args: |
            SERVEROPS_UID=${{ vars.SERVEROPS_UID || '1000' }}
            SERVEROPS_GID=${{ vars.SERVEROPS_GID || '1000' }}

      # 把两个镜像按生产的样子接起来跑一遍,再产出可信构建凭证。
      #
      # 用面板渲染 compose 时会施加的那组约束启动:非 root、丢掉全部 capability、
      # no-new-privileges,并且【不加 seccomp:unconfined】—— 上游自带的编排写死了
      # 那一条,而面板无法表达它,所以这里必须在默认 seccomp 下证明引擎能跑。
      #
      # 注意这只是构建期证据。runner 的内核比生产机宽松,真正的判定在服务器上
      # 用同一批 digest 再跑一次(见 README 的接入步骤)。
      - name: Verify both images work together
        env:
          CONSOLE: ghcr.io/thesyart/xiaodan-server-console@${{ steps.image_console.outputs.digest }}
          ENGINE: ghcr.io/thesyart/xiaodan-server-engine@${{ steps.image_engine.outputs.digest }}
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force xiaodan-console-smoke xiaodan-engine-smoke >/dev/null 2>&1 || true
            docker network rm xiaodan-smoke >/dev/null 2>&1 || true
            # 这个目录 chown 给 1000:1000 了(runner 用户已不是属主),普通 rm 删不掉里面的 .config.yaml;
            # 它装着服务端密钥,不能留在盘上
            sudo rm -rf "$RUNNER_TEMP/engine-data" || true
          }
          trap cleanup EXIT
          docker pull "$CONSOLE"
          docker pull "$ENGINE"
          docker network create xiaodan-smoke

          docker run --detach --name xiaodan-console-smoke --network xiaodan-smoke \
            --network-alias console --user 1000:1000 --init \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /app/data:uid=1000,gid=1000,mode=0700 \
            --publish 127.0.0.1:18002:8002 "$CONSOLE"
          for _ in $(seq 30); do
            curl --fail --silent http://127.0.0.1:18002/health >/dev/null && break
            test "$(docker inspect --format '{{.State.Running}}' xiaodan-console-smoke)" = true \
              || { docker logs --tail 80 xiaodan-console-smoke; exit 1; }
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18002/health

          # 没有 Bearer 时 manager-api 必须拒绝。HTTP 状态码一直是 200,业务错误在
          # 响应体的 code 里 —— 从前这里断言状态码,等于什么都没断言。
          code="$(curl --silent -X POST http://127.0.0.1:18002/xiaozhi/config/server-base \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{process.stdout.write(String(JSON.parse(s).code))})")"
          test "$code" = "401" || { echo "无凭据访问 manager-api 应回 401,实际 $code"; exit 1; }

          # 用控制台自己的密钥拼出引擎的配置,走的就是生产那条路。
          secret="$(docker exec xiaodan-console-smoke node console/dist/cli.js show-secret | tr -d '\r\n')"
          test -n "$secret"
          mkdir -p "$RUNNER_TEMP/engine-data"
          cat > "$RUNNER_TEMP/engine-data/.config.yaml" <<YAML
          server:
            ip: 0.0.0.0
            port: 8000
            http_port: 8003
          manager-api:
            url: http://console:8002/xiaozhi
            secret: $secret
          prompt_template: xiaodan-base-prompt.txt
          YAML
          # 先改权限再改属主:换主之后 runner 用户就不是属主了,chmod 会被拒。
          chmod 0600 "$RUNNER_TEMP/engine-data/.config.yaml"
          sudo chown -R 1000:1000 "$RUNNER_TEMP/engine-data"

          docker run --detach --name xiaodan-engine-smoke --network xiaodan-smoke --network-alias engine \
            --user 1000:1000 --init --cap-drop ALL --security-opt no-new-privileges \
            --volume "$RUNNER_TEMP/engine-data:/opt/xiaozhi-esp32-server/data" \
            --publish 127.0.0.1:18000:8000 "$ENGINE"
          for _ in $(seq 45); do
            curl --fail --silent http://127.0.0.1:18000/ >/dev/null && break
            test "$(docker inspect --format '{{.State.Running}}' xiaodan-engine-smoke)" = true \
              || { docker logs --tail 120 xiaodan-engine-smoke; exit 1; }
            sleep 2
          done
          curl --fail --silent -o /dev/null http://127.0.0.1:18000/

          # 真正要证明的是它拿到了控制台的配置并把 provider 装载起来了,
          # 而不是只有一个端口在监听。
          logs="$(docker logs xiaodan-engine-smoke 2>&1)"
          echo "$logs" | grep -q '从API读取配置' || { echo "引擎没有走 api 模式:"; echo "$logs" | tail -120; exit 1; }
          # 只认无歧义的崩溃信号。上游在正常设备交互里也会打 ]-ERROR- 行(比如网关暂时不可用),
          # 拿它当失败条件会让这条流水线时好时坏。
          echo "$logs" | grep -q 'Traceback (most recent call last)' && { echo "引擎启动时抛了异常:"; echo "$logs" | tail -120; exit 1; }

          # 默认 seccomp 下把音频相关的原生库真正加载一次:onnxruntime 是 VAD 的,
          # opuslib_next 是解码设备音频的,它们才是会被 seccomp 拦的那类代码。
          docker exec xiaodan-engine-smoke python -c "
          import onnxruntime, opuslib_next, numpy
          import core.providers.asr.gateway_chat as a, core.providers.tts.gateway_omni_tts as t
          import core.providers.asr.qwen_audio_asr as qa, core.providers.tts.qwen_audio_tts as qt
          onnxruntime.InferenceSession('/opt/xiaozhi-esp32-server/models/snakers4_silero-vad/src/silero_vad/data/silero_vad.onnx', providers=['CPUExecutionProvider'])
          opuslib_next.Decoder(16000, 1)
          print('audio stack ok', numpy.__version__)
          "
          test "$(docker exec xiaodan-engine-smoke id -u)" = "1000"

          # 自写插件按引擎自己的方式导入并真正调用一次(说明见 server/tests/smoke_plugins.py 开头)。
          docker exec -i xiaodan-engine-smoke python - < server/tests/smoke_plugins.py
          # 对上游的三处修补都在镜像里生效
          docker exec xiaodan-engine-smoke grep -q "'<redacted>' if k.lower()" core/connection.py
          docker exec xiaodan-engine-smoke grep -q 'textUtils.get_emotion(self, da_text)' core/connection.py
          docker exec xiaodan-engine-smoke grep -q '_xd_patched_response_with_functions' core/providers/llm/openai/openai.py
          # DSML 文本工具调用经真实的 openai provider 与引擎的合并逻辑走一遍(说明见 server/tests/smoke_engine.py 开头)
          docker exec -i xiaodan-engine-smoke python - < server/tests/smoke_engine.py
          # 千问识别与合成对着容器里假的百炼服务端走一遍:协议顺序、打断、失败重试、保活、上游 processed_chars 修复(说明见文件开头)
          docker exec -i xiaodan-engine-smoke python - < server/tests/smoke_qwen_audio.py
          # 大脑在控制塔:真实的 chat() 经 xiaodan_agent 走一轮假控制塔,以及设备桥的全部接口(说明见文件开头)
          # 走网关的那两个 provider:对着假网关跑一遍,证明工厂能按 type 加载、继承链是通的(说明见文件开头)
          docker exec -i xiaodan-engine-smoke python - < server/tests/smoke_gateway_audio.py
          docker exec -i xiaodan-engine-smoke python - < server/tests/smoke_agent.py
          docker exec xiaodan-engine-smoke grep -q 'xiaodan_bridge.register(self)' core/connection.py
          docker exec xiaodan-engine-smoke grep -q 'xiaodan_bridge.unregister(self)' core/connection.py
          docker exec xiaodan-engine-smoke grep -q 'xiaodan_bridge.add_bridge_routes' core/http_server.py
          docker exec xiaodan-engine-smoke grep -q '_xiaodan_bridge.install_text_handler(message_registry)' core/handle/textHandle.py
          # 运行中的引擎确实挂上了设备桥,而且控制塔按默认地址 http://engine:8003 够得着;不带密钥必须 401,带上 200
          # 密钥经环境变量传:它是随机生成的 base64url,可能以 - 开头,
          # 当位置参数传给 node 会被当成选项解析(bad option,退出码 9;2026-09-18 就撞上了)
          docker exec --env BRIDGE_SECRET="$secret" xiaodan-console-smoke node -e "
            const s = process.env.BRIDGE_SECRET;
            (async () => {
              const bare = await fetch('http://engine:8003/xiaodan/bridge/health');
              if (bare.status !== 401) throw new Error('设备桥不带密钥应回 401,实际 ' + bare.status);
              const ok = await fetch('http://engine:8003/xiaodan/bridge/health', { headers: { authorization: 'Bearer ' + s } });
              if (ok.status !== 200) throw new Error('设备桥带密钥应回 200,实际 ' + ok.status);
              console.log('bridge reachable', await ok.text());
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Record trusted build proof (console)
        shell: bash
        env:
          SERVICE: console
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ghcr.io/thesyart/xiaodan-server-console
          DIGEST: ${{ steps.image_console.outputs.digest }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const e = process.env;
          const checkoutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(checkoutSha) || checkoutSha !== e.EXPECTED_SHA ||
              !/^[a-f0-9]{40}$/.test(e.GITHUB_SHA) || !/^sha256:[a-f0-9]{64}$/.test(e.DIGEST) ||
              !/^[a-z][a-z0-9-]*$/.test(e.SERVICE)) throw new Error('Invalid build proof identity');
          for (const key of ['GITHUB_RUN_ID', 'GITHUB_RUN_NUMBER', 'GITHUB_RUN_ATTEMPT']) {
            if (!/^[1-9][0-9]*$/.test(e[key]) || !Number.isSafeInteger(Number(e[key]))) throw new Error('Invalid run identity');
          }
          const proof = { version: 1, repository: e.GITHUB_REPOSITORY, workflow: 'serverops-image.yml',
            runId: Number(e.GITHUB_RUN_ID), runNumber: Number(e.GITHUB_RUN_NUMBER), runAttempt: Number(e.GITHUB_RUN_ATTEMPT),
            headSha: e.GITHUB_SHA, checkoutSha, service: e.SERVICE, image: e.IMAGE, digest: e.DIGEST };
          const directory = path.join(e.RUNNER_TEMP, 'serverops-proof-' + e.SERVICE);
          fs.mkdirSync(directory, { recursive: true });
          fs.writeFileSync(path.join(directory, 'release.json'), JSON.stringify(proof) + '\n', { mode: 0o600 });
          NODE

      - name: Upload trusted build proof (console)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serverops-image-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serverops-proof-console/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Record trusted build proof (engine)
        shell: bash
        env:
          SERVICE: engine
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ghcr.io/thesyart/xiaodan-server-engine
          DIGEST: ${{ steps.image_engine.outputs.digest }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const e = process.env;
          const checkoutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(checkoutSha) || checkoutSha !== e.EXPECTED_SHA ||
              !/^[a-f0-9]{40}$/.test(e.GITHUB_SHA) || !/^sha256:[a-f0-9]{64}$/.test(e.DIGEST) ||
              !/^[a-z][a-z0-9-]*$/.test(e.SERVICE)) throw new Error('Invalid build proof identity');
          for (const key of ['GITHUB_RUN_ID', 'GITHUB_RUN_NUMBER', 'GITHUB_RUN_ATTEMPT']) {
            if (!/^[1-9][0-9]*$/.test(e[key]) || !Number.isSafeInteger(Number(e[key]))) throw new Error('Invalid run identity');
          }
          const proof = { version: 1, repository: e.GITHUB_REPOSITORY, workflow: 'serverops-image.yml',
            runId: Number(e.GITHUB_RUN_ID), runNumber: Number(e.GITHUB_RUN_NUMBER), runAttempt: Number(e.GITHUB_RUN_ATTEMPT),
            headSha: e.GITHUB_SHA, checkoutSha, service: e.SERVICE, image: e.IMAGE, digest: e.DIGEST };
          const directory = path.join(e.RUNNER_TEMP, 'serverops-proof-' + e.SERVICE);
          fs.mkdirSync(directory, { recursive: true });
          fs.writeFileSync(path.join(directory, 'release.json'), JSON.stringify(proof) + '\n', { mode: 0o600 });
          NODE

      - name: Upload trusted build proof (engine)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serverops-image-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serverops-proof-engine/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
