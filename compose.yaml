# 手工部署用的编排。
#
# 运维面板走镜像发布时【不读这个文件】—— 它按 root 批准的策略自己渲染一份,
# 组件名是 console / engine,身份、端口、挂载、网络都由那份策略决定。
# 这里是给"还没纳管进面板"或"本地起一套试试"的场合用的。
#
# 与被替换掉的官方智控台相比,这里少了 MySQL 与 Redis 两个容器:
# 控制台的全部状态就是一个 SQLite 文件,备份它就够了。
#
# 两个镜像都由本仓库的 Dockerfile 产出(target console / engine),
# 由 GitHub Actions 推到私有 ghcr.io。provider 与提示词已固化进引擎镜像,
# 不再需要把代码文件挂进容器。
services:
  xiaodan-console:
    image: ${XIAODAN_CONSOLE_IMAGE:-ghcr.io/thesyart/xiaodan-server-console:latest}
    container_name: xiaodan-console
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "${XIAODAN_UID:-1000}:${XIAODAN_GID:-1000}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      # 只绑回环。公网入口一律经宿主 nginx。
      - "127.0.0.1:${XIAODAN_CONSOLE_PORT:-8002}:8002"
    mem_limit: 256m
    volumes:
      - type: bind
        source: ${XIAODAN_DATA_DIR:?请指定控制台数据目录的绝对路径}
        target: /app/data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 设备直连的 WebSocket 服务端。配置来自控制台(api 模式)。
  xiaodan-engine:
    image: ${XIAODAN_ENGINE_IMAGE:-ghcr.io/thesyart/xiaodan-server-engine:latest}
    container_name: xiaodan-engine
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    # 刻意不写 seccomp:unconfined。上游自带的编排有那一条,但面板渲染 compose 时
    # 无法表达它,所以这里与生产保持一致 —— 默认 seccomp 下能跑才算数。
    security_opt: [no-new-privileges:true]
    user: "${XIAODAN_UID:-1000}:${XIAODAN_GID:-1000}"
    depends_on: [xiaodan-console]
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:8000:8000"   # 设备 WebSocket
    mem_limit: 800m
    volumes:
      # 只有 .config.yaml。它里面的 manager-api.url 手工部署时要写
      # http://xiaodan-console:8002/xiaozhi(容器名),纳管后是 http://console:8002/xiaozhi。
      - type: bind
        source: ${XIAODAN_ENGINE_DATA:?请指定服务端配置目录的绝对路径}
        target: /opt/xiaozhi-esp32-server/data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
